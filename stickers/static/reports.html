<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Reports - Panini Tracker</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .group-header { background: #e2e8f0; padding: 12px; border-radius: 12px; margin-top: 24px; border: 1px solid var(--border); }
        .group-header h2 { margin: 0; font-size: 1.25rem; }
        .country-entry { margin-left: 16px; border-left: 3px solid #cbd5e1; padding-left: 16px; margin-top: 16px; }
        .nav-links { margin-bottom: 24px; display: flex; gap: 12px; }
        .tab-btn { background: var(--muted); }
        .tab-btn.active { background: var(--primary); }
        .sticker-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .sticker-item { background: var(--surface); border: 1px solid var(--border); padding: 4px 10px; border-radius: 8px; font-size: 0.9rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .parallel-tag { display: inline-block; padding: 2px 6px; border-radius: 4px; color: white; margin-left: 6px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
        .back-btn { background: #4b5563; }
    </style>
</head>
<body>
    <div class="app-shell">
        <header>
            <h1>Inventory Reports</h1>
            <div class="nav-links">
                <a href="/"><button type="button" class="back-btn">&larr; Back</button></a>
                <button id="btn-duplicates" class="tab-btn active">Duplicate Stickers</button>
                <button id="btn-parallels" class="tab-btn">Parallel Stickers</button>
            </div>
        </header>

        <main class="card">
            <div id="status-message" class="status"></div>
            <div id="report-content">
                <p>Loading reports...</p>
            </div>
        </main>
    </div>
    <script src="/static/reports.js"></script>
</body>
</html>
